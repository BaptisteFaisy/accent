# File de merge Mergify — socle CI self-hosted (R630).
#
# Le depot demarre sans gate IA ni batterie de tests : les queue_conditions
# n'exigent donc aucun check inexistant (le socle CI est en dry-run —
# variable de depot HERMES_LITE_DRY_RUN=1). Le seul check exige est
# `ci-budget`, livre par le socle : aucune PR ne peut entrer dans la file
# avec un job declare a plus de 5 minutes. Quand la CI reelle du depot
# existera, ajouter dans queue_conditions :
#   - check-success = "<check reel>"
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      # Budget CI 5 min (règle user 2026-10-24) : le garde-fou du socle.
      - check-success = ci-budget
      # CI réelle du dépôt : typecheck + tests + build + budget bundle.
      - check-success = ci
      # Le gate hermes-lite n'est PAS exigé ici : en dry-run il ne publie son
      # check que sur une PR déjà fraîche, donc l'exiger crée un verrouillage
      # mutuel (la file attend le check, le check attend la fraîcheur que seule
      # la file apporte par `update_method: rebase`). Constat PR #4, 11/11.
      # Le gate garde son rôle : rebase/étiquetage des conflits + label
      # `hermes/intervention-humaine`, que la file respecte ci-dessous.
      - -conflict
      - -draft
      - -label = hermes/intervention-humaine
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "30 seconds"
    max_checks_retries: 1
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # N workers self-hosted (R630, labels accent-worker) ; la speculation
  # Mergify reste bornee a 4, ajustable.
  max_parallel_checks: 4

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections_settings:
  auto_merge_conditions: true
